{% if form.non_field_errors %}<div class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="form-field">
    {% if field.label %}<label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-semibold">{{ field.label }}</label>{% endif %}
    {{ field }}
    {% if field.help_text %}<div class="helptext mt-1">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>
{% endfor %}
