{% if person.profile.photo %}<img src="{{ person.profile.photo.url }}" alt="{{ person.username }}" class="{{ size|default:'h-10 w-10' }} shrink-0 rounded-full object-cover">{% else %}<span class="{{ size|default:'h-10 w-10' }} flex shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-amber-400 to-rose-500 font-bold uppercase text-white" aria-hidden="true">{{ person.username|first }}</span>{% endif %}
