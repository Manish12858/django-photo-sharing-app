{% extends 'users/base.html' %}
{% block title %}Login · Photo App{% endblock %}
{% block body %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6">Log in</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="field">
            <label class="block text-sm font-semibold mb-1" for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}{{ form.username.errors }}
        </div>
        <div class="field">
            <label class="block text-sm font-semibold mb-1" for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}{{ form.password.errors }}
        </div>
        <button class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg py-2" type="submit">Log in</button>
    </form>
    <div class="mt-6 text-sm text-gray-600 flex justify-between">
        <a class="text-indigo-600 hover:underline" href="{% url 'password_reset' %}">Forgot password?</a>
        <a class="text-indigo-600 hover:underline" href="{% url 'register' %}">Create an account</a>
    </div>
</div>
{% endblock %}
