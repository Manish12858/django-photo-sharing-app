{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="mx-auto mt-12 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold">Log in</h1>
    <p class="mt-1 text-sm text-slate-500">New to PhotoNest? <a href="{% url 'register' %}" class="font-semibold text-rose-500 hover:underline">Create an account</a></p>
    <form method="post" class="mt-6 space-y-4" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include 'partials/form_fields.html' with form=form %}
        <button type="submit" class="w-full cursor-pointer rounded-lg bg-rose-500 py-2.5 font-semibold text-white hover:bg-rose-600">Log in</button>
    </form>
    <p class="mt-4 text-sm"><a href="{% url 'password_reset' %}" class="text-rose-500 hover:underline">Forgot password?</a></p>
</div>
{% endblock %}
