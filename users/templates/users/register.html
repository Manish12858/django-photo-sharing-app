{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block body %}
<div class="mx-auto mt-12 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold">Create your account</h1>
    <p class="mt-1 text-sm text-slate-500">Already have one? <a href="{% url 'login' %}" class="font-semibold text-rose-500 hover:underline">Log in</a></p>
    <form method="post" class="mt-6 space-y-4" novalidate>
        {% csrf_token %}
        {% include 'partials/form_fields.html' with form=form %}
        <button type="submit" class="w-full cursor-pointer rounded-lg bg-rose-500 py-2.5 font-semibold text-white hover:bg-rose-600">Sign up</button>
    </form>
</div>
{% endblock %}
