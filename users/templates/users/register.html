{% extends 'users/base.html' %}
{% block title %}Sign up · Photo App{% endblock %}
{% block body %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6">Create your account</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ user_form.non_field_errors }}
        {% for field in user_form %}
        <div class="field">
            <label class="block text-sm font-semibold mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}{{ field.errors }}
        </div>
        {% endfor %}
        <button class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg py-2" type="submit">Sign up</button>
    </form>
    <p class="mt-6 text-sm text-gray-600">Already have an account? <a class="text-indigo-600 hover:underline" href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
