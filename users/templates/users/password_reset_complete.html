{% extends 'base.html' %}
{% block title %}Password reset{% endblock %}
{% block body %}
<div class="mx-auto mt-12 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm text-center">
    <h1 class="text-2xl font-bold">Password reset</h1>
    <p class="mt-2 text-slate-600">Your password has been set. You can log in now.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-block rounded-lg bg-rose-500 px-5 py-2 font-semibold text-white hover:bg-rose-600">Log in</a>
</div>
{% endblock %}
