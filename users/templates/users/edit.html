{% extends 'base.html' %}
{% block title %}Edit profile{% endblock %}
{% block body %}
<div class="mx-auto mt-10 max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-bold">Edit profile</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4" novalidate>
        {% csrf_token %}
        {% include 'partials/form_fields.html' with form=user_form %}
        {% include 'partials/form_fields.html' with form=profile_form %}
        <button type="submit" class="w-full cursor-pointer rounded-lg bg-rose-500 py-2.5 font-semibold text-white hover:bg-rose-600">Save</button>
    </form>
    <p class="mt-6 text-sm"><a href="{% url 'password_change' %}" class="text-rose-500 hover:underline">Change password</a></p>
</div>
{% endblock %}
