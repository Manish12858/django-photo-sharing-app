{% extends 'users/base.html' %}
{% block body %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow p-8 text-center">
    <h1 class="text-2xl font-bold mb-2">Welcome, {{ new_user.first_name|default:new_user.username }}!</h1>
    <p class="text-gray-600 mb-6">Your account has been created.</p>
    <a class="inline-block bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg px-5 py-2" href="{% url 'login' %}">Log in</a>
</div>
{% endblock %}
