{% extends 'users/base.html' %}
{% block body %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6">Reset password</h1>
    <p class="text-sm text-gray-600 mb-4">Enter your email and we will send you a reset link.</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div class="field">
            <label class="block text-sm font-semibold mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}{{ field.errors }}
        </div>
        {% endfor %}
        <button class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg py-2" type="submit">Submit</button>
    </form>
    
</div>
{% endblock %}
