{% extends 'base.html' %}
{% block title %}New post{% endblock %}
{% block body %}
<div class="mx-auto mt-10 max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-bold">Share a photo</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4" novalidate>
        {% csrf_token %}
        {% include 'partials/form_fields.html' with form=form %}
        <img id="preview" class="hidden max-h-80 w-full rounded-xl object-contain" alt="Preview of the selected photo">
        <button type="submit" class="w-full cursor-pointer rounded-lg bg-rose-500 py-2.5 font-semibold text-white hover:bg-rose-600">Publish</button>
    </form>
</div>
<script>
    document.getElementById('{{ form.image.id_for_label }}').addEventListener('change', function (event) {
        const file = event.target.files[0];
        const preview = document.getElementById('preview');
        if (file) { preview.src = URL.createObjectURL(file); preview.classList.remove('hidden'); }
        else { preview.classList.add('hidden'); }
    });
</script>
{% endblock %}
